<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel | Caya Diamonds</title>
<link rel="icon" href="../../assets/marca/favicon.png">
<link rel="preload" href="../../assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/site.css?v=20261025160538">
<style>
.painel{max-width:1280px;margin:0 auto;padding:36px var(--g) 96px}
.painel [hidden]{display:none!important}
.p-topo{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--linha-forte)}
.p-topo h1{font-weight:300;font-stretch:112%;font-size:clamp(28px,3vw,40px);line-height:1}
.p-topo small{display:block;font-size:12px;color:var(--cinza);margin-top:8px}
.periodo{display:flex;border:1px solid var(--linha)}
.periodo button{padding:9px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-2)}
.periodo button[aria-pressed="true"]{background:var(--preto);color:var(--fundo)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);margin-top:28px}
.kpis div{background:var(--fundo);padding:18px 18px 16px}
.kpis b{display:block;font-weight:300;font-size:30px;font-stretch:106%;line-height:1.1}
.kpis span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza)}
.kpis em{display:block;font-style:normal;font-size:12px;color:var(--texto-2);margin-top:4px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:40px 48px;margin-top:44px}
.cx h2{font-size:11px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--cinza);padding-bottom:10px;border-bottom:1px solid var(--linha);margin-bottom:14px}
.cx.larga{grid-column:1/-1}
/* barras por dia */
.barras{position:relative;display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--linha-forte)}
.barras i{flex:1;min-width:2px;background:var(--preto);border-radius:4px 4px 0 0;position:relative;cursor:default}
.barras i.zero{background:transparent}
.barras i:hover,.barras i:focus-visible{background:var(--texto-2)}
.barras .dica{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--preto);color:var(--fundo);font-size:11px;font-style:normal;padding:5px 8px;white-space:nowrap;pointer-events:none;opacity:0;z-index:2}
.barras i:hover .dica,.barras i:focus-visible .dica{opacity:1}
.eixo{display:flex;justify-content:space-between;font-size:11px;color:var(--cinza);margin-top:6px}
.total-graf{font-size:13px;color:var(--texto-2);margin-bottom:10px}
/* funil */
.funil{display:grid;gap:10px}
.funil div{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;font-size:13px}
.funil .trilho{height:14px;background:var(--linha);position:relative}
.funil .trilho i{position:absolute;inset:0 auto 0 0;background:var(--preto);border-radius:0 4px 4px 0}
.funil .n{text-align:right;font-weight:400}
.funil small{color:var(--cinza);font-size:11px;display:block}
/* tabelas */
.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);text-align:left;padding:6px 8px 8px 0;border-bottom:1px solid var(--linha)}
.tab td{padding:9px 8px 9px 0;border-bottom:1px solid var(--linha);vertical-align:top}
.tab .num{text-align:right;font-variant-numeric:tabular-nums}
.tab small{display:block;color:var(--cinza);font-size:11px}
.rolar{overflow-x:auto}
.rolar .tab{min-width:860px}
.etq{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--linha);color:var(--texto-2);white-space:nowrap}
.etq.comprou{background:var(--preto);color:var(--fundo);border-color:var(--preto)}
.etq.pag{border-color:var(--preto);color:var(--preto)}
.vazio{color:var(--cinza);font-size:13px;padding:8px 0}
.aviso-p{margin-top:40px;max-width:520px}
.aviso-p a{display:inline-block;margin-top:16px;padding:14px 20px;background:var(--preto);color:var(--fundo);text-decoration:none;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.atualiza{font-size:11px;color:var(--cinza)}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <a class="marca" href="../papel/index.html?v=20261025160538"><img src="../../assets/marca/caya-tinta.png" alt="Caya Diamonds" width="454" height="126"></a>
    <nav class="indice" aria-label="Painel"><span class="pequeno">Painel</span></nav>
  </div>
</header>

<main class="painel">
  <div class="p-topo">
    <div><h1>Como o site está indo</h1><small id="sub">carregando…</small></div>
    <div class="periodo" role="group" aria-label="Período">
      <button type="button" data-d="1">Hoje</button><button type="button" data-d="7">7 dias</button><button type="button" data-d="30" aria-pressed="true">30 dias</button><button type="button" data-d="90">90 dias</button>
    </div>
  </div>

  <div id="sem-acesso" class="aviso-p" hidden></div>

  <div id="conteudo" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="grade">
      <div class="cx"><h2>Visitantes por dia</h2><p class="total-graf" id="t-vis"></p><div class="barras" id="g-vis" role="img"></div><div class="eixo" id="e-vis"></div></div>
      <div class="cx"><h2>Vendas por dia (R$)</h2><p class="total-graf" id="t-rec"></p><div class="barras" id="g-rec" role="img"></div><div class="eixo" id="e-rec"></div></div>
      <div class="cx"><h2>Funil</h2><div class="funil" id="funil"></div></div>
      <div class="cx"><h2>De onde vêm</h2><table class="tab" id="origens"></table></div>
      <div class="cx"><h2>Peças mais vistas</h2><table class="tab" id="p-vistas"></table></div>
      <div class="cx"><h2>Mais colocadas na sacola</h2><table class="tab" id="p-sacola"></table></div>
      <div class="cx"><h2>Mais vendidas</h2><table class="tab" id="p-vendidas"></table></div>
      <div class="cx"><h2>Aparelhos</h2><table class="tab" id="aparelhos"></table></div>
      <div class="cx"><h2>Regiões (pelo fuso do aparelho)</h2><table class="tab" id="regioes"></table></div>
      <div class="cx"><h2>Campanhas (links com utm)</h2><table class="tab" id="campanhas"></table></div>
      <div class="cx larga"><h2>Pedidos</h2><div class="rolar"><table class="tab" id="pedidos"></table></div></div>
      <div class="cx larga"><h2>Visitantes</h2><div class="rolar"><table class="tab" id="visitantes"></table></div></div>
    </div>
    <p class="atualiza" id="atualiza" style="margin-top:28px"></p>
  </div>
</main>

<script src="../../data/catalogo.js?v=20261025160538"></script>
<script src="../comum.js?v=20261025160538"></script>
<script>
(async function(){
const {C,brl}=Caya, $=s=>document.querySelector(s);
const R=c=>brl(Math.round(c)/100), N=n=>Number(n||0).toLocaleString('pt-BR');
const pct=(a,b)=>b?(a/b*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':'—';
const nomePeca=id=>((C.pecas.find(p=>p.id===id)||{}).nome)||id;
const dataHora=d=>new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

if(!Caya.contaAtiva()){ $('#sub').textContent='Conta de cliente desligada.'; return; }
let dias=30, timer=null;

function barras(el, eixo, serie, campo, fmt){
  const max=Math.max(1,...serie.map(d=>d[campo]));
  el.innerHTML=serie.map(d=>{
    const v=d[campo], h=v?Math.max(2,v/max*100):0, dia=new Date(String(d.dia).slice(0,10)+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    return `<i class="${v?'':'zero'}" style="height:${h}%" tabindex="0" aria-label="${dia}: ${fmt(v)}"><em class="dica">${dia} · ${fmt(v)}</em></i>`;
  }).join('');
  el.setAttribute('aria-label', serie.map(d=>d.dia+': '+fmt(d[campo])).join(', '));
  const f=d=>new Date(String(d.dia).slice(0,10)+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  eixo.innerHTML=serie.length?`<span>${f(serie[0])}</span><span>${f(serie[serie.length-1])}</span>`:'';
}
function tabela(el, cab, linhas, vazio){
  el.innerHTML=linhas.length?`<thead><tr>${cab.map(c=>`<th class="${c[1]||''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${linhas.map(l=>`<tr>${l.map((v,k)=>`<td class="${cab[k][1]||''}">${v}</td>`).join('')}</tr>`).join('')}</tbody>`
    :`<tbody><tr><td class="vazio">${vazio||'Nada no período.'}</td></tr></tbody>`;
}

async function carregar(){
  let d;
  try{ d=await Caya.servidor('painel',{dias}); }
  catch(e){
    $('#conteudo').hidden=true; $('#sem-acesso').hidden=false;
    const logada=await Caya.sessao();
    $('#sub').textContent='';
    $('#sem-acesso').innerHTML=logada?'<p>Esta conta não tem acesso ao painel. Entre com o e-mail da Caya.</p><a href="'+Caya.pagina('conta')+'?voltar=1">Trocar de conta</a>'
      :'<p>Entre com o e-mail da Caya para ver o painel.</p><a href="'+Caya.pagina('conta')+'?voltar=1">Entrar</a>';
    return;
  }
  $('#sem-acesso').hidden=true; $('#conteudo').hidden=false;
  const r=d.resumo;
  $('#sub').textContent=(dias===1?'Hoje':'Últimos '+dias+' dias')+' · desde '+new Date(d.desde).toLocaleDateString('pt-BR');
  const kp=[['Visitantes',N(r.visitantes),N(r.sessoes)+' visitas · '+N(r.paginas)+' páginas'],
    ['Na sacola',N(r.sacolas),pct(r.sacolas,r.visitantes)+' dos visitantes'],
    ['Abriram pagamento',N(r.pagamentos),pct(r.pagamentos,r.sacolas)+' de quem pôs na sacola'],
    ['Vendas',N(r.vendas),pct(r.vendas,r.visitantes)+' de conversão'],
    ['Receita',R(r.receita),r.vendas?'ticket médio '+R(r.receita/r.vendas):'—'],
    ['Contas novas',N(r.contas_novas),'descontos '+R(r.descontos)+' · cashback usado '+R(r.cashback_usado)]];
  $('#kpis').innerHTML=kp.map(k=>`<div><span>${k[0]}</span><b class="mono">${k[1]}</b><em>${k[2]}</em></div>`).join('');

  barras($('#g-vis'),$('#e-vis'),d.por_dia,'visitantes',v=>N(v)+' visitante'+(v===1?'':'s'));
  barras($('#g-rec'),$('#e-rec'),d.por_dia,'receita',v=>R(v));
  $('#t-vis').textContent=N(r.visitantes)+' visitantes no período';
  $('#t-rec').textContent=R(r.receita)+' em '+N(r.vendas)+' venda'+(r.vendas===1?'':'s');

  const f=[['Visitaram',r.visitantes],['Puseram na sacola',r.sacolas],['Abriram o pagamento',r.pagamentos],['Compraram',r.vendas]];
  $('#funil').innerHTML=f.map((x,k)=>`<div><span>${x[0]}${k?`<small>${pct(x[1],f[k-1][1])} da etapa anterior</small>`:''}</span><span class="trilho"><i style="width:${r.visitantes?Math.max(x[1]?1:0,x[1]/r.visitantes*100):0}%"></i></span><span class="n mono">${N(x[1])}</span></div>`).join('');

  tabela($('#origens'),[['Origem'],['Visitantes','num'],['Sacola','num'],['Vendas','num'],['Receita','num']],
    d.origens.map(o=>[esc(o.origem),N(o.visitantes),N(o.sacolas),N(o.vendas),R(o.receita)]));
  tabela($('#p-vistas'),[['Peça'],['Visitantes','num']],d.pecas_vistas.slice(0,10).map(p=>[esc(nomePeca(p.peca)),N(p.visitantes)]));
  tabela($('#p-sacola'),[['Peça'],['Vezes','num']],d.pecas_sacola.slice(0,10).map(p=>[esc(p.peca),N(p.vezes)]));
  tabela($('#p-vendidas'),[['Peça'],['Unidades','num']],d.pecas_vendidas.slice(0,10).map(p=>[esc(p.peca),N(p.unidades)]));
  tabela($('#aparelhos'),[['Aparelho'],['Visitas','num']],d.dispositivos.map(x=>[esc(x.nome),N(x.sessoes)]));
  tabela($('#regioes'),[['Região'],['Visitas','num']],d.regioes.slice(0,12).map(x=>[esc(x.nome),N(x.sessoes)]));
  tabela($('#campanhas'),[['Campanha'],['Visitas','num']],d.campanhas.map(x=>[esc(x.campanha),N(x.sessoes)]),'Nenhuma visita por link de campanha.');

  const st={pago:'<span class="etq comprou">pago</span>',pendente:'<span class="etq pag">não pago</span>',cancelado:'<span class="etq">cancelado</span>'};
  tabela($('#pedidos'),[['Quando'],['Pedido'],['Peças'],['Cliente'],['Origem'],['Status'],['Total','num']],
    d.pedidos.map(p=>[dataHora(p.quando),esc(p.pedido),(p.itens||[]).map(i=>esc(i.nome)+(i.qtd>1?' ×'+i.qtd:'')+`<small>${esc(i.detalhe||'')}${i.aros&&i.aros.length?' · '+esc(i.aros.join(', ')):''}</small>`).join(''),
      esc(p.cliente||'sem conta'),esc(p.origem||'—'),st[p.status]+(p.metodo?`<small>${p.metodo==='pix'?'Pix':esc(p.metodo)+(p.parcelas>1?' '+p.parcelas+'x':'')}</small>`:''),R(p.total)]));

  tabela($('#visitantes'),[['Última visita'],['Quem'],['Origem'],['Região · aparelho'],['Viu'],['Sacola','num'],['Situação']],
    d.visitantes.map(v=>{
      const sit=v.comprou?`<span class="etq comprou">comprou ${R(v.comprou)}</span>`:v.pagamento_aberto?'<span class="etq pag">abriu pagamento</span>':v.sacola?'<span class="etq">sacola</span>':'<span class="etq">só olhou</span>';
      const cli=v.cliente?esc(v.cliente.nome||v.cliente.email)+`<small>${esc([v.cliente.nome?v.cliente.email:'',v.cliente.telefone].filter(Boolean).join(' · '))}</small>`:'Anônimo<small>'+esc(v.visitante.slice(-6))+'</small>';
      return [dataHora(v.ultima)+`<small>${N(v.sessoes)} visita${v.sessoes>1?'s':''} · ${N(v.paginas)} páginas</small>`,cli,esc(v.origem||'—'),
        esc(v.regiao||'—')+`<small>${esc(v.dispositivo||'')}</small>`,(v.pecas||[]).map(nomePeca).map(esc).join(', ')||'<small>nenhuma peça</small>',
        v.sacola?R(v.sacola)+`<small>${esc((v.sacola_itens||[]).join(', '))}</small>`:'—',sit];
    }),'Nenhum visitante no período.');
  $('#atualiza').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · atualiza sozinho a cada minuto.';
}
document.querySelectorAll('.periodo button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.periodo button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  dias=+b.dataset.d; carregar();
});
await carregar();
timer=setInterval(()=>{ if(!document.hidden) carregar(); },60000);
})();
</script>
</body>
</html>
